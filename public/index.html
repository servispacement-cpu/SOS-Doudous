<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>SOS-Doudous</title>
    </head>
    <body>
        <div>
            <h1>Bienvenue sur le site de notre association SOS Doudous</h1>
        </div>
        <div>
            <h1>Porter plainte :</h1>
            <form id="formpl">
            <label>Sélectionner la personne contre qui va la plainte :</label><br><select id="sur" required></select><br><br>
            <textarea id="com" rows="12" cols="60" placeholder="En quoi la plaite devrait être validée ?" required></textarea><br><br>
            <button> Porter plainte </button>
            </form>
        </div>

        <div>
            <h1>Se connecter à son compte SECTE DOUDOUS</h1>
            <form id="con">
                <label>Entrez votre identifient : </label><br><input type="text" id="idCon" required><br><br>
                <label>Entrez votre mot de passe : </label><br><input type="password" id="mdpCon" required><br><br>
                <button>Se connecter</button>
            </form>
        </div>

        <div id="ptpl" style="display: none;">
            <h1>Les plaintes contre vous :</h1>
        </div>

        <div id="rej">
            <h1>Rejoindre la SECTE DOUDOUS (si vous n'y êtes pas encore)</h1>
            <form id="rej">
                <label>Créez votre identifient : </label><br><input type="text" id="idRej" required><br><br>
                <label>Créez votre mot de passe : </label><br><input type="password" id="mdpRej" required><br><br>
                <label>Confirmation du versement de 15€ par mois (cochez pour confirmer) : </label><br><input type="checkbox" id="payRej" required><br><br>
                <button>Créer un compte SECTE DOUDOUS</button>
            </form>
        </div>
        
        <div>
            <h1>Nos actions :</h1>
            <p></p>
        </div>

        <div>
            <img src="">
            <h1 id="lograna"></h1>
            <h2>Commandez vos cookies dès maintenant : </h2> 
            <button id="logranaL">Cliquez ici</button>
        </div>

    <script src="tools.js"></script>
    <script src="script.js"></script>
    </body>
</html>
